name: Release

on:
  push:
    branches: [main, implement-nfl]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Read version from changelog
        id: version
        run: |
          VERSION=$(grep -m1 -oP '^## \[\K[0-9]+\.[0-9]+\.[0-9]+(?=\])' CHANGELOG.md)
          echo "Found version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if tag exists
        id: check
        run: |
          if git rev-parse -q --verify "refs/tags/v${{ steps.version.outputs.version }}" >/dev/null; then
            echo "Tag already exists, nothing to release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "New version, releasing."
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

